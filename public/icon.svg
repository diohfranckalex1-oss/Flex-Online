<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Emerald to Imperial Turquoise Gradient -->
    <linearGradient id="flexEmeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F6E56" />
      <stop offset="50%" stop-color="#148366" />
      <stop offset="100%" stop-color="#1D9E75" />
    </linearGradient>

    <!-- Glossy Highlight Curve -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Shield Armor Gradient -->
    <linearGradient id="shieldBorderGrad" x1="7" y1="5" x2="29" y2="31.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D9E75" />
      <stop offset="50%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0F6E56" />
    </linearGradient>

    <!-- Interlocking F Metallic Gradient -->
    <linearGradient id="letterFGrad" x1="12" y1="9.5" x2="25.5" y2="27.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e6fffa" />
      <stop offset="70%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#1D9E75" />
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#051f18" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle with Deep Emerald and Imperial Turquoise Gradient -->
  <rect width="512" height="512" rx="120" fill="url(#flexEmeraldBg)" />

  <!-- Inner Dark Tech Plate -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#081411" fill-opacity="0.94" stroke="#1D9E75" stroke-opacity="0.4" stroke-width="4" />

  <!-- Glossy top reflection curve -->
  <path d="M 24,128 C 24,70 70,24 128,24 L 384,24 C 442,24 488,70 488,128 L 488,230 C 350,180 150,210 24,280 Z" fill="url(#glossGrad)" />

  <!-- Scaled Flex Online Cyber Emblem -->
  <g transform="translate(31, 31) scale(12.5)" filter="url(#shieldShadow)">
    <!-- Outer Armor Shield Crest -->
    <path
      d="M7 8C7 6.34315 8.34315 5 10 5H26C27.6569 5 29 6.34315 29 8V18C29 25 21 30.5 18 31.5C15 30.5 7 25 7 18V8Z"
      stroke="url(#shieldBorderGrad)"
      stroke-width="1.8"
      fill="#0a1a15"
      fill-opacity="0.95"
    />

    <!-- Subtle Shield Inner Grid Accent -->
    <path
      d="M10 14H26M10 20H26M18 6V30"
      stroke="#1D9E75"
      stroke-opacity="0.15"
      stroke-width="0.8"
    />

    <!-- Futuristic Interlocking F Monogram Structure -->
    <path
      d="M12 9.5H24C24.8284 9.5 25.5 10.1716 25.5 11C25.5 11.8284 24.8284 12.5 24 12.5H15V16H22C22.8284 16 23.5 16.6716 23.5 17.5C23.5 18.3284 22.8284 19 22 19H15V26C15 26.8284 14.3284 27.5 13.5 27.5C12.6716 27.5 12 26.8284 12 26V9.5Z"
      fill="url(#letterFGrad)"
    />

    <!-- Robotic Optical Visor Eye (Cyber Core) with neon pulse glow -->
    <rect
      x="17"
      y="20.5"
      width="8"
      height="3.2"
      rx="1.6"
      fill="#5eead4"
      filter="url(#neonGlow)"
    />
    <circle cx="21" cy="22.1" r="1.1" fill="#ffffff" />
  </g>

  <!-- Live Status Pulse Beacon on Top-Right Corner -->
  <circle cx="430" cy="82" r="22" fill="#5eead4" fill-opacity="0.3" />
  <circle cx="430" cy="82" r="14" fill="#1D9E75" stroke="#ffffff" stroke-width="3" />
  <circle cx="430" cy="82" r="6" fill="#ffffff" />
</svg>
